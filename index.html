/* Calendário de pagamento, legível em telas pequenas */
.calendar-rules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 22px}
.calendar-rules>div{background:#1d3024;border:1px solid #37523f;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.calendar-rules span{font-size:10px;font-weight:800;letter-spacing:1px;color:#8da697}
.calendar-rules strong{font-size:13px;line-height:1.5;color:var(--ink)}
.admin-deadline{margin:16px 0 19px;padding:13px 15px;background:#203628;border:1px solid #416349;border-radius:12px;color:#b8d0bd;font-size:12px;line-height:1.75;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.admin-deadline strong{color:#d4f0bd}
@media(max-width:550px){.calendar-rules{gap:8px}.calendar-rules>div{padding:11px}.calendar-rules strong{font-size:12px}}

/* Identidade verificada, perfil do membro e moderação Master */
.member-identity,.member-account-bar{display:flex;align-items:center;gap:13px;background:#203528;border:1px solid #476449;border-radius:14px;padding:15px;color:#dfefd8}
.member-identity p,.member-account-bar small{display:block;color:#9ab3a2;font-size:11px;margin:4px 0;overflow-wrap:anywhere}
.member-identity small{color:var(--lime);font-size:11px}
.member-avatar{display:grid;place-items:center;flex:none;width:41px;height:41px;border-radius:13px;background:var(--lime);color:#14271a;font-weight:900;font-size:19px}
.member-account-bar{justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.member-account-bar strong{font:700 16px var(--display)}
.otp-input{font:800 28px var(--display);text-align:center;letter-spacing:9px;height:60px}
@media(max-width:520px){.member-account-bar{align-items:flex-start;flex-direction:column}.member-account-bar .row{width:100%}.member-account-bar .row>button{flex:1}.otp-input{letter-spacing:6px}}

/* Calendário com as três etapas e aceite opcional de WhatsApp */
.calendar-rules{grid-template-columns:repeat(3,minmax(0,1fr))}
.calendar-rules>div small{font-size:11px;color:#a6bca8;line-height:1.55}

};

  const d=phoneDigits(v);
  if(d.length<=2) return d.length?'('+d:'';
  if(d.length<=7) return `(${d.slice(0,2)}) ${d.slice(2)}`;

async function api(path, opts={}) {
  const headers = { ...opts.headers };
  if (opts.body) headers['Content-Type'] = 'application/json';
  let response;
  try { response = await fetch(path, { credentials:'same-origin', ...opts, headers }); }
  catch { throw new Error('Sem conexão com o servidor. Confira sua internet.'); }
  let payload = {};
  try { payload = await response.json(); } catch { /* e.g. 502 */ }
  if (!response.ok) throw new Error(typeof payload.detail === 'string' ? payload.detail : 'Não foi possível completar a operação.');

async function sendRegistration(form) {
  const button=form.querySelector('[type=submit]');setLoading(button,true);
  $('#form-error').innerHTML='';
  const f=new FormData(form);
  try {
    const result=await api('/api/register',{method:'POST',body:JSON.stringify({match_id:Number(f.get('match_id')),position:f.get('position')||'indefinido'})});
    if(result.status==='interest'){
      closeModal();await reloadMatches();await loadMy();nav('my');
      toast('Interesse registrado apenas para histórico. Nenhuma vaga foi reservada.');
      return;
    }
    saveToken(result.token);state.registrationToken=result.token;
    closeModal();await reloadMatches();await loadMy();
    toast('Inscrição realizada! Acompanhe o status da sua vaga.');nav('my');
    showMyDetails(result.token);
  } catch(e) { $('#form-error').innerHTML=`<div class="error-box">${escapeHTML(e.message)}</div>`; }
  finally {setLoading(button,false);}
}

async function loadCommunity(matchId){
  const place=$('#community-panel');if(!place)return;
  try{
    const d=await api(`/api/matches/${matchId}/community`);
    if(state.view!=='ranking'||!$('#community-panel'))return;
    const options=state.matches.map(m=>`<option value="${m.id}" ${m.id===matchId?'selected':''}>${shortDate(m.starts_at)} • ${escapeHTML(m.title)}</option>`).join('');
    const nominees=d.players.map(r=>`<div class="roster-person"><span class="roster-index">${r.votes} ★</span><span class="roster-name">${escapeHTML(r.name)}<small>${r.goals} gols • ${r.assists} assistências</small></span>
      <button class="button button-sm ${d.my_vote===r.id?'button-secondary':''}" data-action="vote-mvp" data-id="${r.id}" data-match="${matchId}" ${!d.can_vote||d.my_registration_id===r.id?'disabled':''}>${d.my_vote===r.id?'Meu voto ✓':'Votar'}</button></div>`).join('');
    const maxVotes=Math.max(0,...d.players.map(x=>x.votes));
    const winners=d.players.filter(x=>maxVotes>0&&x.votes===maxVotes).map(x=>x.name).join(', ');
    place.innerHTML=panelTitle('MVP da partida','Vote uma vez por partida. Pode alterar o voto enquanto estiver aberta.')+
      `${maxVotes?`<div class="highlight-bar">🏆 <b>MVP parcial:</b> ${escapeHTML(winners)} com ${maxVotes} voto(s). ${d.voting_enabled?'Resultado ainda pode mudar.':'Votação encerrada.'}</div>`:''}<div class="form-group mb"><label>Escolha a partida</label><select class="form-control" id="community-match">${options}</select></div>
      <p class="notice">${d.voting_enabled?'Votação liberada pelo Master.':'Votação ainda não liberada pelo Master.'} Somente participantes confirmados votam; ninguém vota em si mesmo.</p>
      ${nominees||'<p class="muted">Nenhum participante confirmado nesta partida.</p>'}`;
  }catch(e){place.innerHTML=panelTitle('MVP da partida')+`<p class="muted">${escapeHTML(e.message)}</p>`}
}

function renderAdminOverview(reg,m,data) {
  // A tela do Master espelha a escalação pública, com dados da partida selecionada.
  // Não depende de sessão de membro: apenas de overview autenticado do Master.
  const ordered = reg.filter(r=>r.role==='linha' && r.status==='paid')
    .sort((a,b)=>String(a.paid_at||'').localeCompare(String(b.paid_at||'')) || a.id-b.id);
  const goalies = reg.filter(r=>r.role==='goleiro' && r.status==='paid')
    .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || a.id-b.id);
  const waiting = reg.filter(r=>r.role==='linha' && r.status==='waitlist')
    .sort((a,b)=>Number(!!a.queue_hold)-Number(!!b.queue_hold) ||
      String(a.queue_entered_at||a.created_at||'').localeCompare(String(b.queue_entered_at||b.created_at||'')) ||
      a.id-b.id);
  const pending = reg.filter(r=>r.role==='linha' && r.status==='reserved')
    .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')) || a.id-b.id);
  const allRoster=[
    ...ordered.map((r,i)=>({...r,group:i<10?'titulares':'rodizio',rank:i+1})),
    ...goalies.map(r=>({...r,group:'goleiros',rank:null})),
    ...pending.map(r=>({...r,group:'pendentes',rank:null})),
    ...waiting.map((r,i)=>({...r,group:'fila',rank:r.queue_hold?null:waiting.slice(0,i+1).filter(x=>!x.queue_hold).length}))
  ];
  const occupied=ordered.length+pending.length;
  const free=Math.max(0,m.capacity-occupied);
  const nextMatches=data.matches.filter(x=>x.id!==m.id && x.status==='active')
    .sort((a,b)=>String(a.starts_at||'').localeCompare(String(b.starts_at||''))).slice(0,4);
  return '<div class="content-grid"><div class="content-col">'+
    '<section class="panel" id="admin-home-roster">'+
    panelTitle('Escalação da partida selecionada','A mesma visão da página inicial, com os primeiros pagantes, rodízio, goleiros e fila.')+

    '<button class="button button-sm button-outline" data-action="admin-tab" data-tab="classificacao">Corrigir classificação</button></div>'+
    renderRosterSections(allRoster,'all')+
    '</section>'+
    '</div><div class="content-col">'+
    '<section class="panel">'+panelTitle('Situação da partida','Informações atualizadas do jogo selecionado.')+
    '<div class="upcoming-row"><strong>'+escapeHTML(m.title)+'</strong>'+statusPill(m.state)+'</div>'+
    '<div class="upcoming-row"><strong>Data e horário</strong><span>'+shortDate(m.starts_at)+' · '+clock(m.starts_at)+'</span></div>'+
    '<div class="upcoming-row"><strong>Local</strong><span>'+escapeHTML(m.venue)+'</span></div>'+
    '<div class="upcoming-row"><strong>Confirmados de linha</strong><span>'+ordered.length+' / '+m.capacity+'</span></div>'+
    '<div class="upcoming-row"><strong>Vagas de linha disponíveis</strong><span>'+free+'</span></div>'+
    '<div class="upcoming-row"><strong>Goleiros confirmados</strong><span>'+goalies.length+' (isentos)</span></div>'+
    '<div class="upcoming-row"><strong>Valor por jogador</strong><span>'+money(m.price_cents)+'</span></div>'+
    '<div class="upcoming-row"><strong>Prazo do pagamento</strong><span>'+fullDate(m.payment_deadline)+'</span></div>'+
    '<p class="notice">Goleiros não ocupam as vagas de linha. A ordem do Top 10 segue a confirmação dos pagamentos.</p>'+
    '</section>'+
    '<section class="panel mt">'+panelTitle('Próximas partidas','Escolha outra partida para ver sua escalação.')+
    (nextMatches.length?nextMatches.map(n=>'<div class="upcoming-row"><div><strong>'+
       shortDate(n.starts_at)+' · '+clock(n.starts_at)+'</strong><small class="muted">'+escapeHTML(n.venue)+
       '</small></div><button class="button button-sm button-secondary" data-action="admin-select-match" data-id="'+
       n.id+'">Ver escalação</button></div>').join(''):
       '<p class="muted">Não há outras partidas cadastradas.</p>')+
    '</section>'+
    '</div></div>';
}

function openRankingPeriodForm(edit){

 const d=new FormData(form);const id=d.get('id');const b=form.querySelector('[type=submit]');setLoading(b,true);
 const payload={title:d.get('title'),venue:d.get('venue'),starts_at:offsetDate(d.get('starts_at')),opens_at:offsetDate(d.get('opens_at')),
     payment_deadline:offsetDate(d.get('payment_deadline')),waitlist_releases_at:offsetDate(d.get('waitlist_releases_at')||d.get('payment_deadline')),waitlist_note:d.get('waitlist_note')||'',signup_closes_at:offsetDate(d.get('signup_closes_at')),
     capacity:Number(d.get('capacity')),price_cents:Math.round(Number(d.get('price'))*100),goalie_limit:Number(d.get('goalie_limit'))};
 try{
   const result=await api(id?`/api/admin/matches/${id}`:'/api/admin/matches',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});
   if(!id)state.activeMatch={id:result.id};closeModal();await reloadAdmin();await reloadMatches();toast('Partida salva com sucesso.');
 }catch(e){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(e.message)}</div>`}finally{setLoading(b,false)}
}
async function adminAction(action,id,extra){

  if(action==='sim-full-paid'){await api('/api/admin/demo/full-paid',{method:'POST',body:JSON.stringify({match_id:state.activeMatch.id})});await reloadAdmin();await reloadMatches();toast('Lotação de jogadores de linha simulada. Teste o popup em Início.');return;}
  if(action==='sim-deadline'){await api('/api/admin/demo/expire',{method:'POST',body:JSON.stringify({match_id:state.activeMatch.id})});await reloadAdmin();await reloadMatches();toast('Prazo simulado! Fila atualizada.');return;}
  if(action==='logout'){await api('/api/admin/logout',{method:'POST'});state.admin=null;toast('Sessão encerrada.');return renderAdmin()}
  if(action==='confirm'&&!confirm('Se for goleiro, confirme a isenção. Para jogador de linha, confirme que o Pix realmente entrou na conta. Prosseguir?'))return;
  if(action==='cancel-admin'&&!confirm('Deseja realmente remover esta inscrição? Se ela estiver paga, o reembolso será tratado manualmente.'))return;
  if(action==='draw-teams'&&!confirm('Sortear/recriar os times desta partida?'))return;
  const endpoint=action==='draw-teams'?`/api/admin/matches/${state.activeMatch.id}/draw`:
    action==='dismiss-notice'?`/api/admin/notifications/${id}/dismiss`:
    action==='attendance'?`/api/admin/registrations/${id}/attendance`:
    `/api/admin/registrations/${id}/${action==='confirm'?'confirm':'cancel'}`;
  const body=action==='draw-teams'?{team_count:Number($('#team-count').value)}:action==='attendance'?{attended:Boolean(Number(extra))}:undefined;
  await api(endpoint,{method:'POST',body:body?JSON.stringify(body):undefined});await reloadAdmin();await reloadMatches();toast('Alteração realizada.');
 }catch(e){toast(e.message,true)}
}

document.addEventListener('click',async e=>{
 const target=e.target.closest('[data-action],[data-nav]');
 if(!target)return;
 if(target.matches('a[data-nav]'))e.preventDefault();
 const action=target.dataset.action;const view=target.dataset.nav;
 if(view){nav(view);return}
 const id=target.dataset.id;const token=target.dataset.token;
 switch(action){
  case 'close':closeModal();break;
  case 'open-register':registerModal(id);break;
  case 'member-login':openMemberLogin();break;
  case 'member-profile':openProfile();break;
  case 'member-logout':showLogoutDialog('member');break;
  case 'member-access':
    if(confirm(target.dataset.active==='1'?'Reativar este membro?':'Bloquear a conta? Ele perderá acesso à área de membros.')){
      try{await api(`/api/admin/members/${id}/access`,{method:'POST',body:JSON.stringify({active:target.dataset.active==='1'})});await reloadAdmin();toast('Acesso do membro atualizado.')}catch(err){toast(err.message,true)}
    }break;
  case 'role':state.selectedRole=target.dataset.role;$$('.role-option').forEach(b=>b.classList.toggle('active',b.dataset.role===state.selectedRole));break;
  case 'my-detail':await showMyDetails(token);break;
  case 'get-pix':await getPix(token);break;
  case 'self-cancel':
   if(confirm('Deseja cancelar sua inscrição? Se houver fila, outra pessoa poderá ocupar sua vaga.')){
     try{await api(`/api/registration/${token}/cancel`,{method:'POST'});closeModal();await refresh();toast('Inscrição cancelada.')}catch(err){toast(err.message,true)}
   }break;
  case 'copy':
   try{await navigator.clipboard.writeText(target.dataset.text);toast('Copiado!')}catch{toast('Não foi possível copiar automaticamente. Selecione e copie o texto.',true)}break;
  case 'admin-tab':state.adminTab=target.dataset.tab;if(state.adminTab==='jogadores')state.adminFilter='all';drawAdmin();break;
  case 'rank-select':state.adminRankPeriodId=id;drawAdmin();break;
  case 'rank-new':openRankingPeriodForm(false);break;
  case 'rank-edit':openRankingPeriodForm(true);break;
  case 'rank-open':case 'rank-close':{
    const p=(state.admin?.ranking_periods||[]).find(x=>x.id===state.adminRankPeriodId);
    if(!p)break;
    const operation=action==='rank-open'?'open':'close';
    if(!confirm(operation==='close'?'Encerrar e congelar a classificação deste período? Os resultados continuarão no histórico.':p.status==='draft'?'Abrir este ranking? Partidas nas datas configuradas, inclusive retroativas, serão contabilizadas.':'Reabrir este ranking encerrado? A classificação voltará a ser calculada com os resultados registrados.'))break;
    try{await api('/api/admin/ranking-periods/'+encodeURIComponent(p.id)+'/'+operation,{method:'POST'});await reloadAdmin();toast(operation==='close'?'Ranking encerrado e congelado.':p.status==='draft'?'Ranking aberto para apuração.':'Ranking reaberto para correções.');}
    catch(err){toast(err.message,true);}
    break;
  }
  case 'admin-select-match':{const selected=state.admin?.matches.find(m=>m.id===Number(id));if(selected){state.activeMatch=selected;state.adminTab='visao';drawAdmin();$('#admin-home-roster')?.scrollIntoView({behavior:'smooth',block:'start'});}break;}
  case 'admin-filter':state.adminTab='jogadores';state.adminFilter=target.dataset.filter;drawAdmin();$('#admin-players-list')?.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'clear-admin-filter':state.adminTab='jogadores';state.adminFilter='all';drawAdmin();$('#admin-players-list')?.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'clear-home-filter':state.homeFilter='all';if(state.homeRosterMatchId||state.matches.length)await loadHomeRoster(state.homeRosterMatchId||state.matches[0].id);$('#public-roster')?.scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'home-filter':state.homeFilter=target.dataset.filter;if(!state.member){state.pendingMatchID=null;openMemberLogin()}else{await loadHomeRoster(Number(id));$('#public-roster')?.scrollIntoView({behavior:'smooth',block:'start'});}break;
  case 'run-queue':if(confirm('Executar agora a verificação de prazos e convocar a fila automaticamente, mesmo fora do horário agendado?')){try{const r=await api(`/api/admin/matches/${state.activeMatch.id}/queue/run`,{method:'POST'});await reloadAdmin();toast(r.notice)}catch(err){toast(err.message,true)}}break;
  case 'move-to-queue':case 'release-queue':case 'remove-queue':case 'promote-queue':{
    const r=state.admin?.registrations.find(x=>x.id===Number(id));if(!r)break;
    if(action==='promote-queue'){const occupied=state.admin.registrations.filter(x=>x.match_id===r.match_id&&x.role===r.role&&['paid','reserved'].includes(x.status)).length;
      const m=state.activeMatch;const reserved=state.admin.registrations.filter(x=>x.match_id===r.match_id&&x.role===r.role&&x.status==='reserved');
      const isFull=occupied>=(r.role==='goleiro'?m.goalie_limit:m.capacity);
      const options=reserved.map(x=>`<option value="${x.id}">${escapeHTML(x.name)} (${x.role==='goleiro'?'Goleiro':'Pix pendente'})</option>`).join('');
      modal('Promover da lista de espera',escapeHTML(r.name),`<form id="manual-promotion-form"><input type="hidden" name="reg_id" value="${r.id}"/>
        <p class="notice">${isFull?'Partida lotada. Escolha qual reserva sem Pix será substituída.':'Há vaga livre. O jogador receberá um prazo individual de 30 minutos para pagar.'} Não é permitido retirar pagantes sem tratar o reembolso.</p>

    if(!confirm(message))break;

    try{
      if(action==='manual-save'){
        window.FUTEBOL_manualDraw.parse(payload.lines,payload.goalies);

        toast('Lista de presentes salva neste navegador.');
      }else{
        window.FUTEBOL_manualDraw.draw(state.activeMatch.id,payload);

    modal('Estatísticas do jogador',escapeHTML(r.name),`<form id="stats-form"><input type="hidden" name="reg_id" value="${id}"/><div class="form-grid"><div class="form-group"><label>Gols</label><input type="number" class="form-control" name="goals" min="0" max="100" value="${st?.goals||0}" required/></div><div class="form-group"><label>Assistências</label><input type="number" class="form-control" name="assists" min="0" max="100" value="${st?.assists||0}" required/></div></div><div class="form-actions"><button type="submit" class="button">Salvar números</button></div><div id="form-error"></div></form>`);break;

    }catch(err){toast(err.message,true)}break;
  case 'copy-broadcast':
    try{await navigator.clipboard.writeText(document.querySelector('#broadcast-form [name=message]').value);toast('Mensagem copiada.')}catch{toast('Selecione o texto para copiar.',true)}break;
  case 'enter-demo-admin':{
    if(!state.config.demo)return toast('Acesso demonstrativo indisponível.',true);
    try{
      await api('/api/admin/login',{method:'POST',body:JSON.stringify({preview:true})});
      state.admin=await api('/api/admin/overview');
      drawAdmin();
      toast('Modo demonstração iniciado.');
    }catch(err){toast(err.message,true)}
    break;
  }
  case 'logout':showLogoutDialog('master');break;
  case 'logout-no':closeModal();break;
  case 'logout-yes':{
    const who=target.dataset.who;
    try{
      if(who==='master'){
        await api('/api/admin/logout',{method:'POST'});
        state.admin=null;closeModal();nav('home');toast('Você saiu do painel demonstrativo.');
      }else{
        await api('/api/member/logout',{method:'POST'});
        state.member=null;state.my=[];state.pendingMatchID=null;
        closeModal();nav('home');toast('Você saiu da área do membro.');
      }
    }catch(err){toast(err.message,true)}
    break;
  }
  case 'restore-registration':if(confirm('Restaurar a inscrição? A vaga paga só será recuperada se houver capacidade.')){try{await api(`/api/admin/registrations/${id}/restore`,{method:'POST'});await reloadAdmin();toast('Inscrição restaurada e registrada no histórico.')}catch(err){toast(err.message,true)}}break;
  case 'reset-simulacao':if(confirm('Reiniciar a simulação de 07/11? As mudanças feitas neste navegador serão descartadas, sem afetar o banco real.')){localStorage.removeItem('futebol_demo_07nov2026_v1');location.reload()}break;
  case 'sim-deadline':await adminAction('sim-deadline');break;
  case 'sim-full-paid':await adminAction('sim-full-paid');break;
  case 'confirm':case 'cancel-admin':case 'attendance':case 'draw-teams':case 'dismiss-notice':
    await adminAction(action,id,target.dataset.attended);break;
 }
});
document.addEventListener('submit',async e=>{
 if(!['registration-form','admin-login-form','pix-form','match-form','member-phone-form','member-code-form','member-profile-form','stats-form','broadcast-form','payment-time-form','manual-promotion-form','rotation-form','ranking-period-form','admin-manual-member-form'].includes(e.target.getAttribute('id')))return;
 e.preventDefault();const form=e.target;
 if(form.getAttribute('id')==='admin-manual-member-form'){
   const d=new FormData(form),button=form.querySelector('[type=submit]');
   setLoading(button,true);
   try{
     const member=window.FUTEBOL_adminMember.add({
       name:d.get('name'),email:d.get('email'),phone:d.get('phone'),
       role:d.get('role'),position:d.get('position'),match_id:d.get('match_id')
     });
     closeModal();await reloadAdmin();
     toast(member.message);
   }catch(err){const area=$('#form-error');if(area)area.innerHTML='<div class="error-box">'+escapeHTML(err.message)+'</div>';}
   finally{setLoading(button,false)}
   return;
 }
 if(form.getAttribute('id')==='ranking-period-form'){
   const d=new FormData(form),periodId=d.get('period_id');
   const payload={title:d.get('title'),start_date:d.get('start_date'),end_date:d.get('end_date')};
   const button=form.querySelector('[type=submit]');setLoading(button,true);
   try{
     const response=await api(periodId?'/api/admin/ranking-periods/'+encodeURIComponent(periodId):'/api/admin/ranking-periods',{
       method:periodId?'PATCH':'POST',body:JSON.stringify(payload)});
     state.adminRankPeriodId=response.period.id;
     closeModal();await reloadAdmin();
     toast(periodId?'Período atualizado.':'Período criado. Use Abrir ranking para ativar a apuração.');
   }catch(err){const node=$('#form-error');if(node)node.innerHTML='<div class="error-box">'+escapeHTML(err.message)+'</div>'}
   finally{setLoading(button,false)}
   return;
 }
 if(form.getAttribute('id')==='rotation-form'){
  const winner=new FormData(form).get('winner');
  try{await api('/api/admin/matches/'+state.activeMatch.id+'/rotation',{method:'POST',body:JSON.stringify({winner})});await reloadAdmin();toast('Resultado registrado. Próximo time convocado!')}catch(err){toast(err.message,true)}return;
 }
 if(form.getAttribute('id')==='manual-promotion-form'){
   const d=new FormData(form);const body={action:'promote'};if(d.get('replace_registration_id'))body.replace_registration_id=Number(d.get('replace_registration_id'));
   try{await api(`/api/admin/registrations/${d.get('reg_id')}/queue`,{method:'POST',body:JSON.stringify(body)});closeModal();await reloadAdmin();toast('Jogador promovido. A fila e as vagas foram atualizadas.')}catch(err){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`;}return;
 }
 if(form.getAttribute('id')==='payment-time-form'){
   const f=new FormData(form);try{await api(`/api/admin/registrations/${f.get('reg_id')}/payment-time`,{method:'PUT',body:JSON.stringify({paid_at:offsetDate(f.get('paid_at'))})});closeModal();await reloadAdmin();toast('Horário do Pix corrigido e posição recalculada.')}catch(err){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`}return;
 }
 if(form.getAttribute('id')==='stats-form'){
   const f=new FormData(form);try{await api(`/api/admin/registrations/${f.get('reg_id')}/stats`,{method:'PUT',body:JSON.stringify({goals:Number(f.get('goals')),assists:Number(f.get('assists'))})});closeModal();await reloadAdmin();toast('Estatísticas registradas.')}catch(err){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`}return;
 }
 if(form.getAttribute('id')==='broadcast-form'){
   const f=new FormData(form);if(!confirm('Programar este comunicado somente para membros que autorizaram WhatsApp? O envio pode gerar restrições no número se usar uma integração não oficial.'))return;
   try{const res=await api('/api/admin/whatsapp/broadcast',{method:'POST',body:JSON.stringify({match_id:state.activeMatch.id,audience:f.get('audience'),message:f.get('message'),confirm:true})});await reloadAdmin();toast(`${res.queued} mensagens foram enfileiradas. Entrega não garantida.`);}catch(err){toast(err.message,true)}return;
 }
 if(form.getAttribute('id')==='member-phone-form'){
   const b=form.querySelector('[type=submit]');setLoading(b,true);try{const phone=phoneDigits(new FormData(form).get('phone'));if(phone.length!==11||phone[2]!=='9')throw new Error('Digite um celular válido com DDD e 9 dígitos.');const res=await api('/api/member/otp/start',{method:'POST',body:JSON.stringify({phone})});openMemberCode(phoneMask(phone),res.demo_code);}catch(err){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`}finally{setLoading(b,false)}return;
 }
 if(form.getAttribute('id')==='member-code-form'){
   const b=form.querySelector('[type=submit]');setLoading(b,true);try{const f=new FormData(form);const res=await api('/api/member/otp/verify',{method:'POST',body:JSON.stringify({phone:f.get('phone'),code:f.get('code')})});state.member=res.member;closeModal();if(res.needs_profile)openProfile();else if(state.pendingMatchID){const mid=state.pendingMatchID;state.pendingMatchID=null;registerModal(mid)}else{nav('my');toast('Acesso autorizado.')}}catch(err){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`}finally{setLoading(b,false)}return;
 }
 if(form.getAttribute('id')==='member-profile-form'){
   const b=form.querySelector('[type=submit]');setLoading(b,true);try{const f=new FormData(form);const res=await api('/api/member/profile',{method:'PUT',body:JSON.stringify({name:f.get('name'),email:f.get('email'),whatsapp_opt_in:f.get('whatsapp_opt_in')==='on'})});state.member=res.member;closeModal();if(state.pendingMatchID){const mid=state.pendingMatchID;state.pendingMatchID=null;registerModal(mid)}else nav('my');toast('Cadastro salvo.')}catch(err){$('#form-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`}finally{setLoading(b,false)}return;
 }
 if(form.getAttribute('id')==='registration-form')return sendRegistration(form);
 if(form.getAttribute('id')==='pix-form'){const f=new FormData(form);return showPix(f.get('token'),f.get('cpf'))}
 if(form.getAttribute('id')==='match-form')return submitMatch(form);
 if(form.getAttribute('id')==='admin-login-form'){
   const button=form.querySelector('[type=submit]');setLoading(button,true);
   try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:new FormData(form).get('password'),email:new FormData(form).get('email')||''})});state.admin=await api('/api/admin/overview');drawAdmin();toast('Acesso liberado.');}
   catch(err){$('#admin-error').innerHTML=`<div class="error-box">${escapeHTML(err.message)}</div>`}finally{setLoading(button,false)}
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='manual-lines'){
   const preview=$('#manual-preview');
   if(preview)preview.textContent=window.FUTEBOL_manualDraw.summary(e.target.value,Number($('#manual-size')?.value||5));
 }
 if(e.target.matches('#broadcast-form [name=message]')){
    const msg=e.target.value;
    $$('[data-wa-link]').forEach(link=>{link.href=`https://wa.me/55${link.dataset.waLink}?text=${encodeURIComponent(msg)}`});
 }
 if(e.target.matches('input[name="phone"]')){
   const before=e.target.value;
   const masked=phoneMask(before);
   if(before!==masked)e.target.value=masked;
   e.target.setCustomValidity(phoneDigits(masked).length===11&&phoneDigits(masked)[2]==='9'?'':'Informe DDD e 9 dígitos.');
 }
});
document.addEventListener('change',e=>{
 if(e.target.matches('#broadcast-form [name=audience]')){
   const selected=e.target.value;
   $$('[data-wa-status]').forEach(row=>{row.style.display=selected==='all'||row.dataset.waStatus===selected?'':'none'});
   return;
 }
 if(e.target.id==='admin-status-filter'){state.adminFilter=e.target.value;drawAdmin();$('#admin-players-list')?.scrollIntoView({block:'start'});return;}
 if(e.target.id==='ranking-period-select'){state.rankPeriodId=e.target.value;renderRanking();return;}
 if(e.target.id==='admin-rank-period-select'){state.adminRankPeriodId=e.target.value;drawAdmin();return;}
 if(e.target.id==='manual-size'){const preview=$('#manual-preview');if(preview)preview.textContent=window.FUTEBOL_manualDraw.summary($('#manual-lines')?.value||'',Number(e.target.value));return;}
 if(e.target.id==='community-match'){loadCommunity(Number(e.target.value));return;}
 if(e.target.id==='admin-match-select'){
   const m=state.admin?.matches.find(x=>x.id===Number(e.target.value));if(m){state.activeMatch=m;drawAdmin()}
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-overlay'))closeModal()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}

document.addEventListener('change',async e=>{
 if(e.target.id!=='member-photo-input'||!e.target.files?.length)return;
 const info=$('#photo-status');
 try{
  const optimized=await window.FUTEBOL_demoPhoto(e.target.files[0]);
  const member=DEMO.members.find(x=>x.id===state.member?.id);
  if(!member)throw new Error('Entre como membro para adicionar uma foto.');
  member.photo_data=optimized;
  state.member.photo_data=optimized;
  saveDemo();
  if(info)info.innerHTML='<div class="success-box">Foto registrada nesta demonstração. Ela aparecerá no seu perfil e nas listas deste navegador.</div>';
 }catch(error){
  if(info)info.innerHTML='<div class="error-box">'+escapeHTML(error.message)+'</div>';
  e.target.value='';
 }
});
startup();

</script></body></html>
