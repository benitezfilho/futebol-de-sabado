name = "futebol-de-sabado-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://benitezfilho.github.io"
REGISTRATION_ENABLED = "false"
PAYMENT_PROVIDER = "manual"

[[d1_databases]]
binding = "DB"
database_name = "futebol-de-sabado-db"
database_id = "COLE_AQUI_O_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]
