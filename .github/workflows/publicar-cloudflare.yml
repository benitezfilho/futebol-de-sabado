name: Publicar API na Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-deploy
  cancel-in-progress: false

jobs:
  publicar:
    name: Criar tabelas e publicar Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar configuracao segura
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Validar codigo e testes
        run: |
          node --check src/index.js
          node --test tests/*.test.js

      - name: Aplicar migracoes ao banco D1 remoto
        run: npx wrangler d1 migrations apply futebol-de-sabado-db --remote

      - name: Publicar API Workers
        run: npx wrangler deploy
