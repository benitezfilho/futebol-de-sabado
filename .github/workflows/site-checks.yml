name: Validar site público

on:
  push:
    paths:
      - "index.html"
      - "features-v8.js"
      - "features-ranking.js"
      - "features-manual-draw.js"
      - "features-admin-member.js"
      - "tests/manual-draw-admin.test.mjs"
      - "tests/v8.test.mjs"
      - "tests/lista-0711.test.mjs"
      - "tests/ranking-periods.test.mjs"
      - ".github/workflows/site-checks.yml"
  workflow_dispatch:

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar ausência de senha demonstrativa no código
        run: |
          if grep -qi 'demo123' index.html; then
            echo "Senha de teste hardcoded encontrada no site público."
            exit 1
          fi
      - name: Validar blocos JavaScript da página
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          tags=re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>",html,flags=re.I|re.S)
          assert len(tags)>=2, "Blocos de script inesperados"
          for i,script in enumerate(tags):
              Path(f"script{i}.mjs").write_text(script,encoding="utf-8")
          PY
          for file in script*.mjs; do node --check "$file"; done
      - name: Validar funcionalidades V8
        run: |
          node --check features-v8.js
          node --check features-ranking.js
          node --check features-manual-draw.js
          node --check features-admin-member.js
          node --test tests/manual-draw-admin.test.mjs
          node --test tests/v8.test.mjs
          node --test tests/lista-0711.test.mjs
          node --test tests/ranking-periods.test.mjs
      - name: Testar botão para ver todos
        run: |
          grep -q "clear-admin-filter" index.html
          grep -q "clear-home-filter" index.html
      - name: Conferir telas da demonstração no Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome não está instalado no runner. Os testes Node continuam válidos."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          addon="""<script>
          setTimeout(() => {
            const admin = document.querySelector('[data-nav="admin"]');
            if (!admin) { document.body.setAttribute('data-v8-test','nav-missing'); return; }
            admin.click();
            setTimeout(() => {
              const start=document.querySelector('[data-tab="visao"].active');
              const roster=document.querySelector('#admin-home-roster');
              if (!start || !roster || !roster.textContent.includes('Hadrian') ||
                  !roster.textContent.includes('Terror do Ferreira') ||
                  !roster.textContent.includes('Primeiros 10 pagantes')) {
                document.body.setAttribute('data-v8-test','master-home-missing');return;
              }
              const times=document.querySelector('[data-tab="times"]');
              if (!times) { document.body.setAttribute('data-v8-test','tab-missing'); return; }
              times.click();
              setTimeout(() => {
                const ok=!!document.querySelector('[data-action="draw-teams"]') &&
                         document.body.innerText.includes('Goleiros coringas') &&
                         document.body.innerText.includes('Reservas da linha');
                if (!ok) {document.body.setAttribute('data-v8-test','teams-missing');return;}
                document.querySelector('[data-tab="visao"]').click();
                setTimeout(() => {
                  const restored=!!document.querySelector('#admin-home-roster') &&
                    document.querySelector('[data-tab="visao"]').classList.contains('active');
                  document.body.setAttribute('data-v8-test',restored?'ok':'home-return-failed');
                  if(!restored)return;
                  const periodTab=document.querySelector('[data-tab="rankings"]');
                  if(!periodTab){document.body.setAttribute('data-ranking-test','tab-missing');return;}
                  periodTab.click();
                  setTimeout(() => {
                    const btn=document.querySelector('[data-action="rank-new"]');
                    if(!btn){document.body.setAttribute('data-ranking-test','create-missing');return;}
                    btn.click();
                    const form=document.querySelector('#ranking-period-form');
                    if(!form){document.body.setAttribute('data-ranking-test','form-missing');return;}
                    form.querySelector('[name="title"]').value='Ranking retroativo de setembro';
                    form.querySelector('[name="start_date"]').value='2026-09-01';
                    form.querySelector('[name="end_date"]').value='2026-09-30';
                    form.requestSubmit();
                    setTimeout(() => {
                      const open=document.querySelector('[data-action="rank-open"]');
                      if(!open){document.body.setAttribute('data-ranking-test','open-missing');return;}
                      window.confirm=()=>true;
                      open.click();
                      setTimeout(() => {
                        const close=document.querySelector('[data-action="rank-close"]');
                        if(!close){document.body.setAttribute('data-ranking-test','close-missing');return;}
                        close.click();
                        setTimeout(() => {
                          const closed=!!document.querySelector('[data-action="rank-open"]') &&
                            document.body.textContent.includes('Ranking retroativo de setembro');
                          document.body.setAttribute('data-ranking-test',closed?'ok':'closing-failed');
                        },400);
                      },400);
                    },400);
                  },400);
                },350);
              },400);
            },750);
          },600);
          </script>"""
          Path(".smoke-index.html").write_text(html.replace("</body>",addon+"</body>"))
          PY
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --allow-file-access-from-files --virtual-time-budget=8000 \
            --dump-dom "file://$PWD/.smoke-index.html" > /tmp/futebol-smoke.html 2>/tmp/futebol-chrome.log
          grep -q 'data-v8-test="ok"' /tmp/futebol-smoke.html || {
            echo "Teste visual de navegação falhou."
            grep -o 'data-v8-test="[^"]*"' /tmp/futebol-smoke.html | head || true
            tail -20 /tmp/futebol-chrome.log || true
            exit 1
          }
          grep -q 'data-ranking-test="ok"' /tmp/futebol-smoke.html || {
            echo "Teste do ranking retroativo falhou."
            grep -o 'data-ranking-test="[^"]*"' /tmp/futebol-smoke.html | head || true
            tail -20 /tmp/futebol-chrome.log || true
            exit 1
          }
      - name: Verificar sorteio manual, cadastro e logout no Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome não disponível, verificações Node já realizadas."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          addon="""<script>
          (async function(){
            const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const failure=reason=>document.body.setAttribute('data-v9-test',reason);
            try{
              await delay(600);
              if(document.querySelector('#demo-badge'))return failure('badge-still-fixed');
              document.querySelector('[data-nav="admin"]').click();
              await delay(800);
              const tab=document.querySelector('[data-tab="manual"]');
              if(!tab)return failure('manual-tab-missing');
              tab.click();await delay(200);
              const list=document.querySelector('#manual-lines');
              if(!list)return failure('manual-list-missing');
              const names=n=>Array.from({length:n},(_,i)=>'Pessoa '+(i+1)).join('\\n');
              list.value=names(15);
              document.querySelector('#manual-size').value='5';
              document.querySelector('#manual-goalies').value='Terror do Ferreira';
              document.querySelector('[data-action="manual-draw"]').click();
              await delay(450);
              const id=state.activeMatch.id;
              if(DEMO.manualDraws[id]?.result.teams.length!==3||
                 DEMO.manualDraws[id]?.result.reserves.length!==0)
                   return failure('draw-15-failed');
              document.querySelector('#manual-lines').value=names(17);
              document.querySelector('[data-action="manual-draw"]').click();
              await delay(450);
              if(DEMO.manualDraws[id]?.result.teams.length!==3||
                 DEMO.manualDraws[id]?.result.reserves.length!==2)
                   return failure('draw-17-failed');
              document.querySelector('[data-action="add-manual-member"]').click();
              await delay(100);
              const form=document.querySelector('#admin-manual-member-form');
              if(!form)return failure('member-form-missing');
              form.querySelector('[name="name"]').value='Pessoa Simulação';
              form.querySelector('[name="email"]').value='simulacao.v9@example.com';
              form.querySelector('[name="phone"]').value='(62) 99999-5432';
              form.requestSubmit();
              await delay(600);
              if(!DEMO.members.some(x=>x.email==='simulacao.v9@example.com'&&x.admin_created))
                return failure('manual-register-failed');
              document.querySelector('[data-action="logout"]').click();
              await delay(100);
              if(!document.querySelector('#modal-root [data-action="logout-yes"]')||
                 !document.querySelector('#modal-root [data-action="logout-no"]'))
                return failure('logout-dialog-missing');
              document.querySelector('[data-action="logout-no"]').click();
              if(state.view!=='admin')return failure('cancel-logout-failed');
              document.querySelector('[data-action="logout"]').click();
              document.querySelector('#modal-root [data-action="logout-yes"]').click();
              await delay(250);
              if(state.view!=='home'||DEMO.adminLogged)return failure('logout-confirm-failed');
              document.body.setAttribute('data-v9-test','ok');
            }catch(err){failure('unexpected-'+String(err.message).slice(0,80).replace(/[^a-zA-Z0-9-]/g,'-'));}
          })();
          </script>"""
          Path(".smoke-v9.html").write_text(html.replace("</body>",addon+"</body>"))
          PY
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --allow-file-access-from-files --virtual-time-budget=9000 \
            --dump-dom "file://$PWD/.smoke-v9.html" > /tmp/futebol-smoke-v9.html 2>/tmp/futebol-chrome-v9.log
          grep -q 'data-v9-test="ok"' /tmp/futebol-smoke-v9.html || {
            echo "Teste de navegador V9 falhou."
            grep -o 'data-v9-test="[^"]*"' /tmp/futebol-smoke-v9.html | head || true
            tail -25 /tmp/futebol-chrome-v9.log || true
            exit 1
          }
